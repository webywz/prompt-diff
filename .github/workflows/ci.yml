name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify published bin shebang
        run: |
          set -euo pipefail
          test -x dist/cli.js
          head -n 1 dist/cli.js | grep -q '^#!/usr/bin/env node$'
          tarball=$(npm pack --silent)
          contents=$(tar -tzf "$tarball")
          printf '%s\n' "$contents" | grep -Fxq 'package/dist/cli.js'
          rm -f "$tarball"
